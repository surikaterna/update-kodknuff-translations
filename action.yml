name: 'Update Kodknuff Translations'
description: 'Update kodknuff translations to the latest version'
inputs:
  packagePath:
    description: 'relative path to package.json'
    required: true
    default: './package.json'
  translationsPath:
    description: 'relative path to the module exporting the translations'
    required: true
    default: './index'
  artifact:
    description: 'The name of the artifact in Kodknuff to update'
    required: true
  os:
    description: '"win" or "unix"'
    default: 'unix'
outputs:
  version:
    description: 'The version of the translations that were published'
    value: ${{ steps.action.outputs.version }}
runs:
  using: composite
  steps:
    - name: Install patched Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22.23.4'
        package-manager-cache: false
    - name: Update Kodknuff translations
      id: action
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PACKAGEPATH: ${{ inputs.packagePath }}
        INPUT_TRANSLATIONSPATH: ${{ inputs.translationsPath }}
        INPUT_ARTIFACT: ${{ inputs.artifact }}
        INPUT_OS: ${{ inputs.os }}
      run: node "$ACTION_PATH/dist/index.js"
